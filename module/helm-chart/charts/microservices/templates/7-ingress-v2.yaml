{{- if .Values.ingress }}
{{- $ingress := .Values.ingress | default dict }}
{{- $ingressVersion := $ingress.version | default 1 | int }}
{{- if eq $ingressVersion 2 }}
{{- $annotations := $ingress.annotations | default dict }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
{{ toYaml $annotations | nindent 4 }}
spec:
  ingressClassName: alb
  rules:
{{ toYaml $ingress.rules | nindent 4 }}
{{- end }}
{{- end }}

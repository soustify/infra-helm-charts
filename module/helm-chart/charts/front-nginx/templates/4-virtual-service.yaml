{{- $istio := .Values.istio | default dict }}
{{- $enable := $istio.enable | default false }}


{{- if $enable }}
{{- $ingress := $istio.ingress | default dict }}
{{- $virtualService := $ingress.virtualService | default nil }}
{{- if $virtualService }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-ingress
spec:
  hosts:
  {{- range $virtualService.hosts }}
    - {{ . | quote }}
  {{- end }}
  {{- if $virtualService.gateways }}
  gateways:
  {{- range $virtualService.gateways }}
    - {{ . | quote }}
  {{- end }}
  {{- end }}
  http:
{{ toYaml $virtualService.http | indent 4 }}
{{- end }}
{{- end }}

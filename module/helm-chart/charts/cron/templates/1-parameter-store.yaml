{{- if .Values.parameters }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.applicationType |quote }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.region }}
    objects: |
      {{ range $parameters := .Values.parameters }}
      - objectName: {{ $parameters.name | quote }}
        objectType: {{ $parameters.context | quote }}
      {{ end }}
{{- end }}
